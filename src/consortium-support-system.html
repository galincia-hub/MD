<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컨소시엄 지원 시스템 — 프로토타입 v2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5F8;--panel:#FFFFFF;--ink:#0D2436;--ink-2:#41607A;--ink-3:#7E9AAF;
  --line:#D3E0EA;--line-2:#B0C6D6;--blue:#15628E;--blue-lt:#E8F1F7;
  --amber:#B8801E;--amber-bg:#FCF5E7;--now:#0E7C6B;--now-bg:#E4F3F0;
  --pri:#C0561D;--pri-bg:#FBEDE4;--sketch:#E9EFF4;--sketch-line:#C3D3DF;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.topbar{background:var(--ink);color:#fff;position:sticky;top:0;z-index:50}
.tb-in{max-width:1240px;margin:0 auto;padding:0 18px}
.tb-1{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.logo{font-size:15px;font-weight:900}.logo span{color:#E9B44C}
.tb-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:#8FB0C6;text-transform:uppercase}
.tb-right{margin-left:auto;display:flex;gap:7px;align-items:center}
.viewtag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;padding:3px 9px;border:1px solid rgba(255,255,255,.28);color:#CBDDE9}
.demo{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;padding:3px 9px;background:#E9B44C;color:#1B2A38;font-weight:600}
.stages{display:flex;overflow-x:auto}
.stage{padding:11px 15px;font-size:13px;white-space:nowrap;color:#A9C4D6;border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px;transition:.15s}
.stage:hover{color:#fff;background:rgba(255,255,255,.05)}
.stage.on{color:#fff;border-bottom-color:#E9B44C;background:rgba(255,255,255,.07)}
.stage .num{font-family:'IBM Plex Mono',monospace;font-size:10px;opacity:.65}
.stage .dot{width:5px;height:5px;border-radius:50%;background:#2FBFA6}
.stage .dot.p{background:#E9704C}
.stage .dot.l{background:#4A90D9}
.stage.led{border-right:1px solid rgba(255,255,255,.15);color:#E9B44C}
.stage.led.on{border-bottom-color:#E9B44C}

.shell{max-width:1240px;margin:0 auto;padding:20px 18px 70px;display:grid;grid-template-columns:236px 1fr;gap:20px;align-items:start}
.side{background:var(--panel);border:1px solid var(--line);position:sticky;top:104px}
.side-h{padding:13px 15px;border-bottom:1px solid var(--line);background:#FAFCFD}
.side-h .sh-n{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--blue)}
.side-h .sh-t{font-size:15px;font-weight:700;margin-top:1px}
.side-h .sh-d{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.55}
.side nav{padding:6px 0}
.side .grp{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.13em;color:var(--ink-3);text-transform:uppercase;padding:9px 15px 4px}
.side a{display:flex;align-items:center;gap:8px;padding:7px 15px;font-size:13px;color:var(--ink-2);text-decoration:none;border-left:3px solid transparent;transition:.13s}
.side a:hover{background:var(--blue-lt);color:var(--blue)}
.side a.on{background:var(--blue-lt);color:var(--blue);border-left-color:var(--blue);font-weight:700}
.side a .ix{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3);min-width:24px}
.side a.on .ix{color:var(--blue)}

.main{min-width:0}
.crumb{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--ink-3);margin-bottom:9px}
.crumb b{color:var(--blue);font-weight:500}
.page-h{background:var(--panel);border:1px solid var(--line);padding:18px 20px}
.ph-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
h1{font-size:22px;font-weight:700;letter-spacing:-.015em}
.badge{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.09em;padding:2px 8px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.badge.now{border-color:var(--now);color:var(--now);background:var(--now-bg)}
.badge.pri{border-color:var(--pri);color:var(--pri);background:var(--pri-bg)}
.badge.later{color:var(--ink-3)}
.badge.pub{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.ph-purpose{font-size:14px;color:var(--ink-2);margin-top:8px;max-width:76ch;line-height:1.75}

.block{background:var(--panel);border:1px solid var(--line);margin-top:14px}
.blk-h{padding:11px 18px;border-bottom:1px solid var(--line);background:#FAFCFD;display:flex;align-items:center;gap:10px}
.blk-h .bl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--blue);text-transform:uppercase}
.blk-h .bd{font-size:11.5px;color:var(--ink-3);margin-left:auto}
.blk-b{padding:16px 18px}

.sk{background:#F7FAFC;border:1px dashed var(--sketch-line);padding:14px}
.sk-note{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-3);letter-spacing:.1em;text-align:center;margin-top:10px}
.row{display:flex;gap:9px;margin-bottom:9px}.row:last-of-type{margin-bottom:0}
.box{background:var(--sketch);border:1px solid var(--sketch-line);padding:9px 11px;font-size:11.5px;color:var(--ink-2);flex:1;min-height:38px;display:flex;align-items:center;gap:7px;line-height:1.4}
.box.h{background:#DCE8F1;font-weight:700;color:var(--ink)}
.box.tall{min-height:78px;align-items:flex-start}
.box.narrow{flex:0 0 108px}.box.wide{flex:2}
.tok{color:var(--blue);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;border-bottom:1px dotted var(--blue)}

.svc{list-style:none;display:grid;gap:2px}
.svc li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.65}
.svc li:last-child{border-bottom:none}
.svc li::before{content:"▸";color:var(--blue);flex:none;font-size:11px;line-height:1.9}

.io{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.io-c .iol{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.io-c.w .iol{color:var(--pri)}.io-c.r .iol{color:var(--blue)}
.ent{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border:1px solid var(--line-2);margin:0 4px 4px 0;background:#fff}
.ent:hover{border-color:var(--blue);color:var(--blue)}
.ent.w{border-color:var(--pri);color:var(--pri);background:var(--pri-bg)}
.ent .ec{font-family:'IBM Plex Mono',monospace;font-size:9.5px;opacity:.7}
.io-none{font-size:12px;color:var(--ink-3)}

.ov-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ov{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--blue);padding:14px 16px;cursor:pointer;transition:.15s;text-align:left;display:block;width:100%}
.ov:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(13,36,54,.07)}
.ov.now{border-top-color:var(--now)}.ov.now .ov-t{color:var(--now)}
.ov.pri{border-top-color:var(--pri)}.ov.pri .ov-t{color:var(--pri)}
.ov-n{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3);letter-spacing:.1em}
.ov-t{font-size:16px;font-weight:700;margin:2px 0 4px}
.ov-d{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.ov-c{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--blue);margin-top:8px;padding-top:7px;border-top:1px dashed var(--line)}

.hero{background:var(--panel);border:1px solid var(--line);padding:24px}
.hero h2{font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1.35}
.hero h2 b{color:var(--blue)}
.hero p{font-size:14px;color:var(--ink-2);margin-top:9px;max-width:70ch}
.hero .flow{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.hero .fi{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:4px 9px;background:var(--blue-lt);color:var(--blue)}
.hero .fa{color:var(--line-2);font-size:11px;align-self:center}
.tip{background:var(--amber-bg);border-left:3px solid var(--amber);padding:11px 15px;font-size:12.5px;color:var(--ink-2);margin-top:14px;line-height:1.7}
.tip b{color:var(--amber)}

.tbl{overflow-x:auto;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:640px;background:var(--panel)}
th{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);text-align:left;padding:10px 13px;border-bottom:1.5px solid var(--line-2);font-weight:600;white-space:nowrap;background:#F7FAFC}
td{padding:10px 13px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:top;line-height:1.6}
tr:last-child td{border-bottom:none}
td.k{font-weight:700;white-space:nowrap}
td.m{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-2);white-space:nowrap}
td.num{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap}

@media(max-width:900px){
  .shell{grid-template-columns:1fr}.side{position:static}
  .side nav{display:flex;flex-wrap:wrap;padding:8px}
  .side a{border-left:none;border:1px solid var(--line);margin:2px;padding:6px 10px}
  .side .grp{width:100%}
  .ov-grid,.io{grid-template-columns:1fr}
}

/* ===== 실동작 화면 (1·4단계) ===== */
:root{--red:#B3392A;--red-bg:#FBECE9}
.badge.live{border-color:var(--now);color:#fff;background:var(--now)}
.lv-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.lv-btn{font-family:'Noto Sans KR',sans-serif;font-size:12px;padding:7px 14px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);cursor:pointer;transition:.13s}
.lv-btn:hover{border-color:var(--blue);color:var(--blue)}
.lv-btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.lv-btn.danger{color:var(--red);border-color:var(--red)}
.lv-btn.danger:hover{background:var(--red-bg)}
.lv-btn.sm{padding:3px 9px;font-size:11px}
.lv-form{display:none;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px;background:#FAFCFD;border:1px solid var(--line);margin:10px 0}
.lv-form.on{display:grid}
.lv-form label{font-size:10.5px;color:var(--ink-3);display:block;margin-bottom:4px;font-family:'IBM Plex Mono',monospace;letter-spacing:.04em}
.lv-form input,.lv-form select{width:100%;padding:7px 9px;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-size:12.5px;font-family:'Noto Sans KR',sans-serif}
.lv-form input:focus,.lv-form select:focus{outline:2px solid var(--blue);outline-offset:-1px}
.lv-form .full{grid-column:1/-1}
.lv-form .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.lv-select{padding:6px 10px;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-size:12.5px;font-family:'Noto Sans KR',sans-serif}
.lv-num{width:64px;padding:5px 7px;border:1px solid var(--line-2);text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px}
.lv-empty{text-align:center;color:var(--ink-3);padding:20px !important}
.lv-note{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.6}
.lv-tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;padding:1px 7px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.lv-tag.warn{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.lv-tag.ok{border-color:var(--now);color:var(--now);background:var(--now-bg)}
</style>
</head>
<body>
<div class="topbar"><div class="tb-in">
  <div class="tb-1">
    <span class="logo">컨소시엄 <span>지원 시스템</span></span>
    <span class="tb-sub">2027 Adora Charter</span>
    <span class="tb-right"><span class="viewtag" id="viewtag">관리자 뷰</span><span class="demo">PROTOTYPE v2</span></span>
  </div>
  <div class="stages" id="stages"></div>
</div></div>
<div class="shell">
  <aside class="side">
    <div class="side-h"><div class="sh-n" id="shn"></div><div class="sh-t" id="sht"></div><div class="sh-d" id="shd"></div></div>
    <nav id="submenu"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>

/* ===== 원장 토큰 해석 — 모든 화면의 숫자는 여기서만 나온다 ===== */
function tok(str){
  return str.replace(/\{([^}]+)\}/g, (m,k)=>{
    const p = k.split('.');
    let val = null;
    if(p[0]==='agent') val = M.biz.agent;
    else if(p[0]==='excl' && p[1]==='list') val = M.exclusions.map(x=>x.reason+' '+x.n).join(' · ');
    else if(/^v\d+$/.test(p[0])){
      const v = M.voyages[+p[0].slice(1)-1]; if(v) val = v[p[1]];
      if(p[1]==='pax'&&val) val = val.toLocaleString();
      if(p[1]==='confirmed'&&val) val = val.toLocaleString();
    }
    else if(/^p\d+$/.test(p[0])){
      const x = M.partners[+p[0].slice(1)-1];
      if(x){ if(p[1]==='left') val = x.alloc - x.sold;
             else if(p[1]==='rate') val = x.alloc? Math.round(x.sold/x.alloc*100) : 0;
             else val = x[p[1]]; }
    }
    else if(p[0]==='cat'){
      const c = M.categories.find(c=>c.code===p[1]); if(c) val = c[p[2]];
    }
    else if(p[0]==='cab'){
      if(p[1]==='sellable') val = M.categories.reduce((a,c)=>a+c.sellable,0).toLocaleString();
      if(p[1]==='excluded') val = M.categories.reduce((a,c)=>a+c.excluded,0);
      if(p[1]==='plan') val = M.categories.reduce((a,c)=>a+c.plan,0).toLocaleString();
    }
    return val===null||val===undefined ? m : '<span class="tok">'+val+'</span>';
  });
}
function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function sketch(rows){
  return '<div class="sk">' + rows.map(r=>'<div class="row">' + r.map(c=>{
    let cls='box', t=c;
    if(t.startsWith('h:')){cls+=' h';t=t.slice(2)}
    if(t.startsWith('narrow:')){cls+=' narrow';t=t.slice(7)}
    if(t.startsWith('wide:')){cls+=' wide';t=t.slice(5)}
    if(t.startsWith('h:')){cls+=' h';t=t.slice(2)}
    if(t.startsWith('tall:')){cls+=' tall';t=t.slice(5)}
    return '<div class="'+cls+'">'+tok(esc(t))+'</div>';
  }).join('') + '</div>').join('') +
  '<div class="sk-note">화면 배치 스케치 — <span class="tok">파란 값</span>은 데이터 원장에서 불러온 것</div></div>';
}

    if(!raw) return;
    const d = JSON.parse(raw);
    (d.voyageCharter||[]).forEach(o=>{ const v=M.voyages.find(x=>x.code===o.code); if(v) v.charter=o.charter; });
    (d.catExcluded||[]).forEach(o=>{ const c=M.categories.find(x=>x.code===o.code); if(c) c.excluded=o.excluded; });
    if(d.exclusionLog) M.exclusionLog = d.exclusionLog;
    if(d.partners) M.partners = d.partners;
    if(d.allocations) M.allocations = d.allocations;
    if(d.bookings) M.bookings = d.bookings;
    if(d.services) M.services = d.services;
  }catch(e){}
}
function recalcCategories(){ M.categories.forEach(c=>{ c.sellable = c.plan - c.excluded; }); }
function syncPartnerTotals(){ M.partners.forEach(p=>{ p.alloc = partnerAllocTotal(p.id); p.sold = partnerSoldTotal(p.id); }); }

function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function fmtN(n){ return (n||0).toLocaleString(); }
function catByCode(code){ return M.categories.find(c=>c.code===code); }
function voyByCode(code){ return M.voyages.find(v=>v.code===code); }
function partnerById(id){ return M.partners.find(p=>p.id===id); }
function activeBookings(){ return M.bookings.filter(b=>b.status!=='취소'); }

function allocQty(voy,cat,pid){ const a=M.allocations.find(x=>x.voyageCode===voy&&x.catCode===cat&&x.partnerId===pid); return a?a.qty:0; }
function setAllocQty(voy,cat,pid,qty){
  qty = Math.max(0, parseInt(qty)||0);
  let a = M.allocations.find(x=>x.voyageCode===voy&&x.catCode===cat&&x.partnerId===pid);
  if(!a){ a={voyageCode:voy,catCode:cat,partnerId:pid,qty:0}; M.allocations.push(a); }
  a.qty = qty;
  persistMaster();
}
function soldQty(voy,cat,pid){
  return activeBookings().filter(b=>b.voyageCode===voy&&b.catCode===cat&&(!pid||b.partnerId===pid)).reduce((s,b)=>s+(b.pax||0),0);
}
function partnerAllocTotal(pid){ return M.allocations.filter(a=>a.partnerId===pid).reduce((s,a)=>s+a.qty,0); }
function partnerSoldTotal(pid){ return activeBookings().filter(b=>b.partnerId===pid).reduce((s,b)=>s+(b.pax||0),0); }

restoreMaster();
recalcCategories();
syncPartnerTotals();

function addExclusion(catCode, reason, n){
  n = parseInt(n)||0;
  if(n<=0||!reason.trim()){ alert('사유와 실수를 입력하세요.'); return; }
  const c = catByCode(catCode); if(!c) return;
  c.excluded += n;
  M.exclusionLog.push({catCode, reason:reason.trim(), n, at:new Date().toISOString().slice(0,10)});
  recalcCategories(); persistMaster(); go(1,1);
}

function editPartner(id){

function savePartner(){
  const id = document.getElementById('pt-id').value;
  const name = document.getElementById('pt-name').value.trim();
  if(!name){ alert('상호를 입력하세요.'); return; }

    const p = partnerById(id);
    Object.assign(p, {name, type:document.getElementById('pt-type').value, contact:document.getElementById('pt-contact').value.trim(), status:document.getElementById('pt-status').value});
  } else {
    M.partners.push({id:uid('pt'), name, type:document.getElementById('pt-type').value, contact:document.getElementById('pt-contact').value.trim(), status:document.getElementById('pt-status').value, alloc:0, sold:0, mix:'미정'});

function exportSettlementCSV2(){
  const header = ['파트너','건수','인원','완납','부분입금','미입금','매출(단가입력분,원)','취소'];
  const lines = [header.join(',')];
  M.partners.forEach(p=>{
    const bks = activeBookings().filter(b=>b.partnerId===p.id);
    const revenueKnown = bks.filter(b=>b.unitPrice).reduce((s,b)=>s+b.unitPrice*b.pax,0);
    lines.push([p.name, bks.length, bks.reduce((s,b)=>s+b.pax,0), bks.filter(b=>b.payStatus==='완납').length, bks.filter(b=>b.payStatus==='부분입금').length,
      bks.filter(b=>b.payStatus==='미입금').length, revenueKnown, M.bookings.filter(b=>b.partnerId===p.id&&b.status==='취소').length].join(','));
  });
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='partner-settlement-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  URL.revokeObjectURL(url);
}

  '<div class="page-h"><div class="ph-top"><h1>파트너 콘솔 — '+esc(p.name)+'</h1><span class="badge live">실동작</span></div>'+
  '<div class="ph-purpose">하드블럭사가 직접 볼 화면의 관리자 미리보기입니다. 잔여 확인을 위해 전화하지 않아도 되는 상태가 목표입니다.</div></div>'+
  '<div class="lv-toolbar">파트너 선택 <select class="lv-select" onchange="UI.consolePartner=this.value; go(4,5)">'+opts+'</select></div>'+
  '<div style="display:flex;gap:10px;margin:14px 0;flex-wrap:wrap">'+
  '<div class="block" style="flex:1;min-width:140px;padding:14px"><div style="font-size:11px;color:var(--ink-3)">배정</div><div style="font-size:22px;font-weight:800">'+fmtN(alloc)+'</div></div>'+
  '<div class="block" style="flex:1;min-width:140px;padding:14px"><div style="font-size:11px;color:var(--ink-3)">판매</div><div style="font-size:22px;font-weight:800">'+fmtN(sold)+'</div></div>'+
  '<div class="block" style="flex:1;min-width:140px;padding:14px"><div style="font-size:11px;color:var(--ink-3)">잔여</div><div style="font-size:22px;font-weight:800">'+fmtN(alloc-sold)+'</div></div>'+
  '<div class="block" style="flex:1;min-width:140px;padding:14px"><div style="font-size:11px;color:var(--ink-3)">부가서비스 신청</div><div style="font-size:22px;font-weight:800">'+fmtN(svcCount)+'</div></div>'+
  '</div>'+
  '<div class="block"><div class="blk-h"><span class="bl">My Bookings</span></div><div class="blk-b"><div class="tbl"><table><thead><tr><th>예약번호</th><th>항차</th><th>카테고리</th><th class="num">인원</th><th>결제</th><th>상태</th></tr></thead><tbody>'+bkRows+'</tbody></table></div></div></div>';
}

const LIVE_PAGES = {
  1: [renderLiveVoyages, renderLiveCabin, renderLiveAlloc, renderLiveCabinAssign],
  4: [renderLivePartners, renderLiveAllocByPartner, renderLiveBooking, renderLiveService, renderLiveSettlement, renderLiveConsole]
};

let cur={s:0,p:-1};
function renderStages(){
  document.getElementById('stages').innerHTML =
    '<button class="stage led '+(cur.s==='L'?'on':'')+'" onclick="go(\'L\',-1)">◈ 데이터 원장</button>' +
    S.map(s=>'<button class="stage '+(s.id===cur.s?'on':'')+'" onclick="go('+s.id+',-1)">'+
      '<span class="num">'+s.id+'</span>'+s.name+(s.now?'<span class="dot"></span>':'')+(s.pri?'<span class="dot p"></span>':'')+(s.live?'<span class="dot l"></span>':'')+'</button>').join('');
}
function renderSide(){
  if(cur.s==='L'){
    document.getElementById('shn').textContent='LEDGER';
    document.getElementById('sht').textContent='데이터 원장';
    document.getElementById('shd').textContent='실제 데이터는 여기 한 번만 입력하고, 모든 화면이 참조한다';
    document.getElementById('submenu').innerHTML =
      '<div class="grp">원장</div>' +
      ['원장 원칙','마스터 데이터','엔티티 정의','참조 관계'].map((t,i)=>
        '<a href="#" class="'+(cur.p===i?'on':'')+'" onclick="go(\'L\','+i+');return false"><span class="ix">L.'+(i+1)+'</span>'+t+'</a>').join('');
    return;
  }
  const st=S[cur.s];
  document.getElementById('shn').textContent='STAGE '+st.id;
  document.getElementById('sht').textContent=st.name;
  document.getElementById('shd').textContent=st.desc;
  document.getElementById('submenu').innerHTML =
    '<div class="grp">화면 목록</div>' +
    '<a href="#" class="'+(cur.p===-1?'on':'')+'" onclick="go('+cur.s+',-1);return false"><span class="ix">◆</span>단계 개요</a>' +
    st.pages.map((p,i)=>'<a href="#" class="'+(cur.p===i?'on':'')+'" onclick="go('+cur.s+','+i+');return false"><span class="ix">'+cur.s+'.'+(i+1)+'</span>'+p.t+'</a>').join('');
}
function entChip(id,isW){
  const e=ENT[id]; if(!e) return '';
  return '<span class="ent '+(isW?'w':'')+'" title="'+esc(e.fields)+'">'+e.name+'<span class="ec">'+e.ko+'</span></span>';
}

/* ===== 원장 화면 ===== */
function ledger(){
  if(cur.p===-1||cur.p===0){
    return '<div class="crumb"><b>LEDGER</b> · 데이터 원장 · 원칙</div>'+
    '<div class="hero"><h2>데이터는 <b>한 번만</b> 입력한다</h2>'+
    '<p>같은 사실을 여러 화면에서 각각 관리하면 반드시 충돌한다. 이 시스템은 마스터 데이터를 한 곳에 두고, 모든 화면은 그것을 읽거나 정해진 한 곳에서만 쓴다. 기획이 끝난 뒤 실제 데이터를 한 번에 입력하고, 이후에는 원장만 갱신한다.</p>'+
    '<div class="flow"><span class="fi">한 번 입력</span><span class="fa">▶</span><span class="fi">원장 저장</span><span class="fa">▶</span><span class="fi">화면은 참조만</span><span class="fa">▶</span><span class="fi">변경은 원장에서</span></div></div>'+
    '<div class="block"><div class="blk-h"><span class="bl">Rules</span><span class="bd">원장 운용 규칙</span></div><div class="blk-b"><ul class="svc">'+
    ['엔티티마다 생성 화면은 단 하나 — 나머지 화면은 읽기만 한다',
     '계산으로 얻을 수 있는 값은 저장하지 않는다 — 잔여 = 배정 − 판매',
     '항차 코드와 객실 카테고리 코드는 아도라 계약서 표기를 그대로 쓴다',
     '조건이 충돌하면 계약 조항이 이긴다 — 조항이 최종 근거',
     '실제 데이터 입력은 기획 확정 후 한 번에 — 화면을 만들면서 조금씩 넣지 않는다',
     '표준 폼 외의 형식으로는 데이터를 받지 않는다 — 변환 작업 자체를 없앤다',
     '원본은 수정하지 않고 버전으로 남긴다'].map(x=>'<li>'+x+'</li>').join('')+
    '</ul></div></div>';
  }
  if(cur.p===1){
    const cat=M.categories, tp=cat.reduce((a,c)=>a+c.plan,0), te=cat.reduce((a,c)=>a+c.excluded,0), ts=cat.reduce((a,c)=>a+c.sellable,0);
    return '<div class="crumb"><b>LEDGER</b> · 마스터 데이터</div>'+
    '<div class="page-h"><div class="ph-top"><h1>마스터 데이터</h1><span class="badge pri">한 번 입력</span></div>'+
    '<div class="ph-purpose">아래 값이 원장의 실제 내용이다. 프로토타입에는 예시 값이 들어 있으며, 기획 확정 후 실제 값으로 한 번에 교체한다. 화면에 보이는 모든 숫자는 이 표에서 나온다.</div></div>'+
    '<div class="block"><div class="blk-h"><span class="bl">Business</span></div><div class="blk-b"><div class="tbl"><table><tbody>'+
    '<tr><td class="k">선사 · 선박</td><td>'+M.biz.line+' · '+M.biz.ship+'</td></tr>'+
    '<tr><td class="k">총 항차</td><td>'+M.biz.total+'항차 (봄 '+M.biz.spring+' · 가을 '+M.biz.autumn+')</td></tr>'+
    '<tr><td class="k">컨소시엄</td><td>'+M.biz.consortium.join(' · ')+'</td></tr>'+
    '<tr><td class="k">포트 에이전시</td><td>'+M.biz.agent+'</td></tr>'+
    '</tbody></table></div></div></div>'+
    '<div class="block"><div class="blk-h"><span class="bl">Voyage</span><span class="bd">항차 '+M.voyages.length+'개</span></div><div class="blk-b"><div class="tbl"><table>'+
    '<thead><tr><th>코드</th><th>항차</th><th>출항일</th><th>박</th><th>정원</th><th>담당</th></tr></thead><tbody>'+
    M.voyages.map(v=>'<tr><td class="m">'+v.code+'</td><td class="k">'+v.name+'</td><td class="m">'+v.dep+'</td><td class="num">'+v.nights+'</td><td class="num">'+v.pax.toLocaleString()+'</td><td>'+v.charter+'</td></tr>').join('')+
    '</tbody></table></div></div></div>'+
    '<div class="block"><div class="blk-h"><span class="bl">Cabin</span><span class="bd">덱플랜 '+tp.toLocaleString()+'실 → 실사 제외 '+te+' → 판매 가능 '+ts.toLocaleString()+'실</span></div><div class="blk-b"><div class="tbl"><table>'+
    '<thead><tr><th>코드</th><th>카테고리</th><th>데크</th><th>도면</th><th>제외</th><th>판매 가능</th></tr></thead><tbody>'+
    cat.map(c=>'<tr><td class="m">'+c.code+'</td><td class="k">'+c.name+' <span style="color:var(--ink-3);font-weight:400">'+c.kr+'</span></td><td class="m">'+c.deck+'</td><td class="num">'+c.plan+'</td><td class="num">'+c.excluded+'</td><td class="num">'+c.sellable+'</td></tr>').join('')+
    '<tr><td></td><td class="k">합계</td><td></td><td class="num">'+tp.toLocaleString()+'</td><td class="num">'+te+'</td><td class="num">'+ts.toLocaleString()+'</td></tr>'+
    '</tbody></table></div>'+
    '<div class="tip">제외 사유 — '+M.exclusions.map(x=>x.reason+' '+x.n+'실').join(' · ')+'. <b>도면상 객실과 판매 가능 객실은 다르다.</b> 실사로 확정된 판매 가능 수량만 재고가 된다.</div>'+
    '</div></div>'+
    '<div class="block"><div class="blk-h"><span class="bl">Partner</span><span class="bd">하드블럭 '+M.partners.length+'개사</span></div><div class="blk-b"><div class="tbl"><table>'+
    '<thead><tr><th>상호</th><th>유형</th><th>배정</th><th>판매</th><th>잔여</th><th>판매율</th><th>상태</th></tr></thead><tbody>'+
    M.partners.map(p=>'<tr><td class="k">'+p.name+'</td><td class="m">'+p.type+'</td><td class="num">'+p.alloc+'</td><td class="num">'+p.sold+'</td><td class="num">'+(p.alloc-p.sold)+'</td><td class="num">'+(p.alloc?Math.round(p.sold/p.alloc*100):0)+'%</td><td>'+p.status+'</td></tr>').join('')+
    '<tr><td class="k">합계</td><td></td><td class="num">'+M.partners.reduce((a,p)=>a+p.alloc,0)+'</td><td class="num">'+M.partners.reduce((a,p)=>a+p.sold,0)+'</td><td class="num">'+M.partners.reduce((a,p)=>a+p.alloc-p.sold,0)+'</td><td></td><td></td></tr>'+
    '</tbody></table></div>'+
    '<div class="tip"><b>잔여와 판매율은 저장하지 않는다.</b> 배정과 판매만 입력하고 나머지는 계산으로 얻는다. 저장된 값이 둘이면 반드시 어긋난다.</div>'+
    '</div></div>';
  }
  if(cur.p===2){
    return '<div class="crumb"><b>LEDGER</b> · 엔티티 정의</div>'+
    '<div class="page-h"><div class="ph-top"><h1>엔티티 정의</h1><span class="badge">'+E.length+'개</span></div>'+
    '<div class="ph-purpose">시스템이 다루는 데이터 단위와 각각의 생성 화면이다. 생성 화면은 엔티티마다 하나뿐이며, 다른 화면은 읽기만 한다.</div></div>'+
    '<div class="block"><div class="blk-h"><span class="bl">Entities</span></div><div class="blk-b"><div class="tbl"><table>'+
    '<thead><tr><th>엔티티</th><th>생성 화면</th><th>주요 필드</th></tr></thead><tbody>'+
    E.map(e=>'<tr><td class="k">'+e.name+'<div style="font-family:IBM Plex Mono,monospace;font-size:10px;color:var(--ink-3);font-weight:400">'+e.ko+'</div></td>'+
      '<td class="m">'+e.owner+'</td><td>'+e.fields+'<div style="color:var(--ink-3);font-size:11.5px;margin-top:3px">'+e.note+'</div></td></tr>').join('')+
    '</tbody></table></div></div></div>';
  }
  // 참조 관계
  const rows = E.map(e=>{
    const readers=[];
    S.forEach(s=>s.pages.forEach(p=>{ if((p.r||[]).includes(e.id)) readers.push(s.id+'.'+p.t); }));
    return {e, readers};
  });
  return '<div class="crumb"><b>LEDGER</b> · 참조 관계</div>'+
  '<div class="page-h"><div class="ph-top"><h1>참조 관계</h1></div>'+
  '<div class="ph-purpose">각 엔티티를 어느 화면이 읽는지 보여준다. 읽는 화면이 많을수록 그 데이터의 정확도가 전체에 영향을 준다.</div></div>'+
  '<div class="block"><div class="blk-h"><span class="bl">Read Map</span></div><div class="blk-b"><div class="tbl"><table>'+
  '<thead><tr><th>엔티티</th><th>생성</th><th>참조 화면</th></tr></thead><tbody>'+
  rows.map(r=>'<tr><td class="k">'+r.e.name+'</td><td class="m">'+r.e.owner+'</td>'+
    '<td class="m">'+(r.readers.length?r.readers.join(' · '):'—')+' <span style="color:var(--ink-3)">('+r.readers.length+')</span></td></tr>').join('')+
  '</tbody></table></div></div></div>';
}

function overview(){
  const st=S[cur.s];
  let h='<div class="crumb"><b>STAGE '+st.id+'</b> · '+st.name+' · 단계 개요</div>'+
  '<div class="hero"><h2>'+st.id+'단계 <b>'+st.name+'</b></h2>'+
  '<p>'+st.desc+'. 아래 '+st.pages.length+'개 화면으로 구성된다.</p>'+
  '<div class="flow">'+st.pages.map((p,i)=>'<span class="fi">'+p.t+'</span>'+(i<st.pages.length-1?'<span class="fa">▶</span>':'')).join('')+'</div></div>'+
  '<div class="block"><div class="blk-h"><span class="bl">Screens</span><span class="bd">클릭하면 화면 정의로 이동</span></div><div class="blk-b"><div class="ov-grid">'+
  st.pages.map((p,i)=>'<button class="ov '+(p.st==='now'?'now':'')+(p.st==='pri'?'pri':'')+'" onclick="go('+cur.s+','+i+')">'+
    '<div class="ov-n">'+cur.s+'.'+(i+1)+' · '+p.u+'</div><div class="ov-t">'+p.t+'</div><div class="ov-d">'+p.p+'</div>'+
    '<div class="ov-c">서비스 '+p.s.length+' · 생성 '+(p.w||[]).length+' · 참조 '+(p.r||[]).length+'</div></button>').join('')+
  '</div></div></div>';
  if(cur.s===0) h+='<div class="tip"><b>단계 번호와 실행 순서는 다르다</b> — 번호는 데이터가 흐르는 순서이고, 착수 순서는 업무 시급성이 정한다. 현 시점 최우선은 <b>3단계 판매자료 제작</b>이며, 0단계 계약 관리는 계약서 최종본이 나오는 대로 병행한다.</div>';
  if(cur.s===1) h+='<div class="tip"><b>재고는 3단으로 완성된다</b> — ① 덱플랜 기준 분류 → ② 실사로 판매 가능 객실 확정 → ③ 배분과 덱플랜 시각화, 최종적으로 예약과 연동해 도면 위 배치 현황까지. 도면상 객실과 판매 가능 객실은 다르다.</div>';
  if(cur.s===3) h+='<div class="tip"><b>현 시점 최우선 단계</b> — 하드블럭 후보사가 자기 고객 반응을 확인해야 계약 의지가 생긴다. 자료를 다 모은 뒤 제작하는 것이 아니라, 제안에 필요한 항목을 먼저 정하고 그 항목만 아도라에 역으로 요청한다. 계약 데드라인은 9월 중순~10월.</div>';
  return h;
}

function page(){
  if(LIVE_PAGES[cur.s] && LIVE_PAGES[cur.s][cur.p]) return LIVE_PAGES[cur.s][cur.p]();
  const st=S[cur.s], p=st.pages[cur.p];
  const b = p.st==='now'?'<span class="badge now">현재 개발</span>' : p.st==='pri'?'<span class="badge pri">우선 착수</span>' : '<span class="badge later">'+st.id+'단계 예정</span>';
  const ub = p.u==='공개'?'<span class="badge pub">공개 · 소비자</span>':'<span class="badge">'+p.u+'</span>';
  return '<div class="crumb"><b>STAGE '+st.id+'</b> · '+st.name+' · '+p.t+'</div>'+
  '<div class="page-h"><div class="ph-top"><h1>'+p.t+'</h1>'+b+ub+'</div><div class="ph-purpose">'+p.p+'</div></div>'+
  '<div class="block"><div class="blk-h"><span class="bl">Layout</span><span class="bd">화면 구성</span></div><div class="blk-b">'+sketch(p.sk)+'</div></div>'+
  '<div class="block"><div class="blk-h"><span class="bl">Services</span><span class="bd">제공 서비스 '+p.s.length+'개</span></div><div class="blk-b"><ul class="svc">'+p.s.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></div>'+
  '<div class="block"><div class="blk-h"><span class="bl">Data</span><span class="bd">원장 연결</span></div><div class="blk-b"><div class="io">'+
  '<div class="io-c w"><div class="iol">이 화면이 생성 · 수정</div>'+((p.w||[]).length?p.w.map(id=>entChip(id,1)).join(''):'<span class="io-none">없음 — 읽기 전용 화면</span>')+'</div>'+
  '<div class="io-c r"><div class="iol">참조만 함</div>'+((p.r||[]).length?p.r.map(id=>entChip(id,0)).join(''):'<span class="io-none">없음</span>')+'</div>'+
  '</div></div></div>';
}

function go(s,p){
  cur={s:s,p:p};
  let tag='관리자 뷰';
  if(s==='L') tag='데이터 원장';
  else if(p>=0){ const u=S[s].pages[p].u; tag = u==='공개'?'소비자 뷰':u+' 뷰'; }
  document.getElementById('viewtag').textContent=tag;
  renderStages(); renderSide();
  document.getElementById('main').innerHTML = s==='L' ? ledger() : (p===-1?overview():page());
  window.scrollTo({top:0,behavior:'instant'});
}
go('L',0);
</script>
