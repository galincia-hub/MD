<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ADORA Survey Admin</title><link rel="stylesheet" href="style.css">
  <style>
  .admin-shell{max-width:1120px;margin:auto;padding:22px 14px 60px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:#fff;border:1px solid #e1e1dc;border-radius:15px;padding:16px}.kpi b{display:block;font-size:27px}.kpi span{font-size:12px;color:#777}
  .panel{background:#fff;border:1px solid #e1e1dc;border-radius:18px;padding:20px;margin-top:14px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}th{font-size:11px;color:#666}
  .login{max-width:420px;margin:10vh auto;background:#fff;padding:26px;border-radius:18px;border:1px solid #ddd}.login input{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;margin:10px 0}
  .tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{padding:10px 12px;background:#eee}.tabs .on{background:#111;color:#fff}
  .comment{padding:12px 0;border-bottom:1px solid #eee;white-space:normal;line-height:1.5}.barrow{display:grid;grid-template-columns:160px 1fr 52px;gap:10px;align-items:center;margin:8px 0}.bar{height:9px;background:#eee;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#111}
  @media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.barrow{grid-template-columns:110px 1fr 42px}}
  @media print{.no-print{display:none!important}.admin-shell{max-width:none}.panel{break-inside:avoid;border-color:#ccc}}
  </style>
</head>
<body><div id="root"></div><script src="config.js"></script><script src="admin.js"></script></body>
</html>
